<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroVed Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Permanent+Marker&family=Great+Vibes&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="banner-container">
        <!-- Background Image -->
        <div class="banner-bg"></div>
        

        
        <!-- Left White Area -->
        <div class="banner-left">
            <div class="logo-area">
                <img src="images/fav_icon.png" alt="AstroVed Logo" class="logo-icon">
                <div class="logo-text">
                    <h1>AstroVed</h1>
                    <p>Elevate Life. Blessings</p>
                </div>
            </div>
            
            <div class="title-area rugged">
                <div class="brush-badge orange">
                    <span>Find Inner Peace in</span>
                </div>
                
                <h1 class="main-title rugged-title">
                    <span class="south-text">SACRED<br>SOUTH</span>
                </h1>
                
                <div class="brush-badge green">
                    <span>A TRANQUIL TEMPLE TOUR</span>
                </div>
            </div>
            
            <div class="rugged-cursive">
                Relax, reflect, and receive divine blessings in nature's sanctuary.
            </div>
        </div>
        
        <!-- Horizontal Floating Bar -->
        <div class="horizontal-floating-bar">
            <div class="floating-item">
                <div class="floating-icon">
                    <img src="images/cal.png" alt="Calendar Icon" class="custom-img-icon">
                </div>
                <div class="floating-label">4 DAYS</div>
            </div>
            
            <div class="floating-item">
                <div class="floating-icon">
                    <img src="images/nyt.png" alt="Night Icon" class="custom-img-icon">
                </div>
                <div class="floating-label">3 NIGHTS</div>
            </div>

            <div class="floating-item">
                <div class="floating-icon">
                    <img src="images/spi.png" alt="Spiritual Icon" class="custom-img-icon">
                </div>
                <div class="floating-label">SPIRITUAL</div>
            </div>

            <div class="floating-item">
                <div class="floating-icon">
                    <img src="images/peace.png" alt="Peaceful Icon" class="custom-img-icon">
                </div>
                <div class="floating-label">PEACEFUL</div>
            </div>
            
            <div class="floating-item">
                <div class="floating-icon">
                    <img src="images/memorable.png" alt="Memorable Icon" class="custom-img-icon">
                </div>
                <div class="floating-label">MEMORABLE</div>
            </div>
        </div>

    </div>
</body>
</html>
